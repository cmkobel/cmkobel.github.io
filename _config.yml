# Site settings. This file is NOT reloaded by `jekyll serve`; restart after editing.
# Navigation and the profile on the front page live in _data/ and reload live.

title       : "Carl Mathias Mølby Kobel"
description : "Bioinformatician in multi-omics integration."
url         : https://cmkobel.github.io
baseurl     : ""
lang        : en
timezone    : Europe/Copenhagen
theme       : null  # no theme: the two files in _layouts/ are the whole design


# Reading files
include:
  - _pages
  - files
exclude:
  - .pixi
  - Gemfile
  - Gemfile.lock
  - local
  - node_modules
  - pixi.lock
  - pixi.toml
  - vendor


# Markdown
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char
  toc_levels: 2..3
  smart_quotes: lsquo,rsquo,ldquo,rdquo


# Every page uses the plain layout unless it says otherwise.
defaults:
  - scope:
      path: ""
    values:
      layout: default


plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
